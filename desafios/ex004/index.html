<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números reais</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <h1>Analisador de Números reais</h1>
        <form action="numero.php" method="post">
            <label for="n">Número real:</label>
            <input type="number" name="n" id="n" step="0.001"> <!-- step para aceitar 3 numeros após a virgula-->
            <input type="submit" value="Analisar">
        </form>
    </main>
</body>
</html>
